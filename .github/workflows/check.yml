name: site-check
on:
    push:
    branches: [main]
    pull_request:
permissions:
    contents: read
jobs:
    check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - run: npx --yes html-validate@11.18.0 "public/*.html" # lint: HTML の書き方を確かめる
        - run: node --test --test-reporter=spec # test: tests/ の中のテストを動かす
